<div class="rm-toast-viewport" aria-live="polite" aria-relevant="additions">
  @for (toast of toastService.toasts(); track toast.id) {
    <div [class]="'rm-toast rm-toast--' + toast.type">
      <div class="rm-toast__icon" aria-hidden="true">
        @switch (toast.type) {
          @case ('success') {
            <rm-icon name="check-circle" [size]="16"></rm-icon>
          }
          @case ('warning') {
            <rm-icon name="alert-triangle" [size]="16"></rm-icon>
          }
          @case ('error') {
            <rm-icon name="x" [size]="16"></rm-icon>
          }
          @case ('ai') {
            <rm-icon name="sparkles" [size]="16"></rm-icon>
          }
          @default {
            <rm-icon name="info" [size]="16"></rm-icon>
          }
        }
      </div>

      <div class="rm-toast__content">
        <p class="rm-toast__title">{{ toast.title }}</p>
        @if (toast.message) {
          <p class="rm-toast__message">{{ toast.message }}</p>
        }
      </div>

      @if (toast.action) {
        <button type="button" class="rm-toast__action" (click)="toastService.runAction(toast)">
          <rm-icon name="undo" [size]="13"></rm-icon>
          <span>{{ toast.action.label }}</span>
        </button>
      }

      <button
        type="button"
        class="rm-toast__close"
        (click)="toastService.dismiss(toast.id)"
        [attr.aria-label]="i18n.t('toast.dismiss')"
      >
        <rm-icon name="x" [size]="12"></rm-icon>
      </button>
    </div>
  }
</div>
