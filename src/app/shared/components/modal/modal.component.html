@if (isOpen()) {
  <div class="rm-modal-overlay" (click)="onBackdropClick($event)">
    <div
      class="rm-modal-box"
      [attr.role]="dialogRole()"
      aria-modal="true"
      [attr.aria-labelledby]="title() ? titleId : null"
      [attr.aria-label]="!title() && ariaLabel() ? ariaLabel() : null"
      [attr.aria-describedby]="subtitle() ? subtitleId : null"
      [style.max-width]="maxWidth()"
      (keydown)="onKeydown($event)"
    >
      <div class="rm-modal-header" [class.rm-modal-header--bare]="!title() && !subtitle()">
        <div class="rm-modal-titles">
          @if (title()) {
            <h2 [id]="titleId" class="rm-modal-title">{{ title() }}</h2>
          }
          @if (subtitle()) {
            <p [id]="subtitleId" class="rm-modal-subtitle">{{ subtitle() }}</p>
          }
        </div>

        <button
          type="button"
          class="rm-modal-close"
          (click)="close()"
          [attr.aria-label]="i18n.t('modal.close')"
        >
          <rm-icon name="x" [size]="14"></rm-icon>
        </button>
      </div>
      <div class="rm-modal-body">
        <ng-content></ng-content>
      </div>
      <div class="rm-modal-footer"><ng-content select="[modal-footer]"></ng-content></div>
    </div>
  </div>
}
