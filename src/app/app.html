<div class="rm-app-container">
  @if (isPublicPage()) {
    <!-- Public pages render their own shell (header, footer) through <rm-public-shell> -->
    <div class="rm-public-main">
      <router-outlet></router-outlet>
    </div>
  } @else {
    <!-- Protected App Layout: Header + Sidebar + Router Outlet -->
    <rm-header [menuOpen]="isMobileMenuOpen()" (toggleMenu)="toggleMobileMenu()"></rm-header>

    <div class="rm-layout-body">
      <rm-sidebar
        [isOpenMobile]="isMobileMenuOpen()"
        (closeMobile)="isMobileMenuOpen.set(false)"
      ></rm-sidebar>

      <main id="rm-main" class="rm-main-content">
        <div class="rm-content-wrapper fade-in">
          <router-outlet></router-outlet>
        </div>
      </main>
    </div>

    @if (!isAiPage()) {
      <rm-ai-fab></rm-ai-fab>
    }
  }

  <rm-toast-container></rm-toast-container>
  <rm-paywall-modal></rm-paywall-modal>
  <rm-confirm-dialog></rm-confirm-dialog>
</div>
