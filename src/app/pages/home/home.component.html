<rm-public-shell>
  <section class="rm-hero" aria-labelledby="rm-hero-title">
    <rm-particle-field></rm-particle-field>

    <div class="rm-hero__inner rm-page">
      <h1 id="rm-hero-title" class="rm-hero__title">
        <span class="rm-hero__line">{{ i18n.t('home.hero.line1') }}</span>
        <span class="rm-hero__line rm-hero__line--accent">{{ i18n.t('home.hero.line2') }}</span>
      </h1>

      <p class="rm-hero__lede">{{ i18n.t('home.hero.sub') }}</p>

      <div class="rm-hero__actions">
        <rm-button variant="primary" size="lg" icon="arrow-right" (clicked)="onStartNow()">{{ i18n.t('home.hero.cta') }}</rm-button>
        <rm-button variant="outline" size="lg" (clicked)="goToResources()">{{ i18n.t('home.hero.cta2') }}</rm-button>
      </div>
    </div>
  </section>
</rm-public-shell>
