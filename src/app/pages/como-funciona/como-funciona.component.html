<rm-public-shell>
  <section id="como-funciona" class="rm-how rm-page">
    <header class="rm-how__head">
      <div class="rm-page-head">
        <h1 class="rm-page-title">{{ i18n.t('home.how.title') }}</h1>
        <p class="rm-page-lede">{{ i18n.t('how.subtitle') }}</p>
      </div>
      <rm-button variant="primary" size="lg" icon="arrow-right" (clicked)="onStartNow()">{{ i18n.t('home.how.cta') }}</rm-button>
    </header>

    <ol class="rm-how__list">
      @for (step of steps; track step.key; let i = $index) {
        <li class="rm-how__step">
          <span class="rm-how__index rm-num" aria-hidden="true">0{{ i + 1 }}</span>
          <div class="rm-how__copy">
            <h2 class="rm-how__title">
              <rm-icon [name]="step.icon" [size]="22" aria-hidden="true"></rm-icon>
              <span>{{ i18n.t('home.how.' + step.key + '.title') }}</span>
            </h2>
            <p class="rm-how__body">{{ i18n.t('home.how.' + step.key + '.body') }}</p>
          </div>
        </li>
      }
    </ol>
  </section>
</rm-public-shell>
